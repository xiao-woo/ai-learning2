# Cloudflare Workers Configuration
name = "ai-learning"
main = "src/worker.py"
compatibility_date = "2024-01-01"

# 静态文件托管
assets = { directory = "public" }

# 环境变量（在 Cloudflare Dashboard 设置）
[vars]
# API key 通过 Dashboard 配置，不要硬编码

# 开发环境
[dev]
port = 8787
local_protocol = "http"

# 生产环境
[env.production]
name = "ai-learning"
